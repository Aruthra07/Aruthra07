<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 120" width="100%" height="100%">
  <style>
    .quote-icon { font-family: Georgia, serif; font-size: 38px; font-weight: bold; fill: #0284C7; opacity: 0.85; }
    
    @keyframes textShimmer {
      0%, 100% { fill: #0F172A; opacity: 0.92; }
      50% { fill: #0284C7; opacity: 1; }
    }
    
    .quote-animated {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      font-style: italic;
      font-weight: 600;
      animation: textShimmer 4s ease-in-out infinite;
    }
    
    .author-animated {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #7C3AED;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Frameless outline card -->
  <rect x="4" y="4" width="872" height="112" fill="none" stroke="rgba(2,132,199,0.35)" stroke-width="1.5" rx="12"/>

  <!-- Quote Icon -->
  <text x="24" y="44" class="quote-icon">“</text>

  <!-- Animated Quote Text -->
  <text x="52" y="52" class="quote-animated">"Data is the new oil, but intelligence is the engine."</text>
  
  <!-- Author -->
  <text x="840" y="90" text-anchor="end" class="author-animated">— Anonymous</text>
</svg>